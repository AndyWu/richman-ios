name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-packages:
    name: Test Swift packages
    runs-on: macos-15
    strategy:
      matrix:
        package:
          - RichmanCore
          - RichmanCityData
          - RichmanAssetsKit
          - RichmanPersistence
          - RichmanGameUI
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: swift test (${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  build-app:
    name: Build iOS app (XcodeGen)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate -p App
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project App/RichmanApp.xcodeproj \
            -scheme RichmanApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
