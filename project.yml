name: RichmanApp
options:
  bundleIdPrefix: com.andywu.richman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RichmanCore:
    path: Packages/RichmanCore
  RichmanCityData:
    path: Packages/RichmanCityData
  RichmanAssetsKit:
    path: Packages/RichmanAssetsKit
  RichmanPersistence:
    path: Packages/RichmanPersistence
  RichmanGameUI:
    path: Packages/RichmanGameUI

targets:
  RichmanApp:
    type: application
    platform: iOS
    sources:
      - path: App/RichmanApp
    info:
      path: App/RichmanApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andywu.richman.app
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: RichmanCore
      - package: RichmanCityData
      - package: RichmanAssetsKit
      - package: RichmanPersistence
      - package: RichmanGameUI

schemes:
  RichmanApp:
    build:
      targets:
        RichmanApp: all
    run:
      config: Debug
    test:
      config: Debug
